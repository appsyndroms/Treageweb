name: Publicera Treageweb

on:
  schedule:
    - cron: "10 21 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dist/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  readiness:
    name: Kontrollera att alla projekt har levererat
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - name: Checkout latest Treageweb
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check delivery readiness
        id: ready
        run: node scripts/readiness.mjs

      - name: Record publication snapshot
        id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: readiness
    if: ${{ needs.readiness.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Treageweb
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.readiness.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify publisher
        run: node --test tests/*.test.mjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build encrypted website
        env:
          TREAGEWEB_USER: ${{ secrets.TREAGEWEB_USER }}
          TREAGEWEB_PASSWORD: ${{ secrets.TREAGEWEB_PASSWORD }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build.mjs

      - name: Upload encrypted website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    name: Töm dist efter publiceringsförsöket
    needs: [readiness, publish]
    if: ${{ always() && needs.readiness.outputs.ready == 'true' && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest Treageweb
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove staged websites and push cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B cleanup-dist origin/main
            git rm -r --ignore-unmatch -- dist
            if git diff --cached --quiet; then
              echo "dist är redan tom."
              exit 0
            fi
            git commit -m "Clear dist after publication attempt"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push misslyckades; försöker igen med senaste main ($attempt/5)."
            sleep 2
          done
          echo "Kunde inte pusha rensningen av dist." >&2
          exit 1
