name: Hämta projektwebbar

on:
  schedule:
    - cron: "45 20 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-project-websites
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest Treageweb
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify artifact receiver
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Collect ready project artifacts
        env:
          GH_TOKEN: ${{ secrets.PROJECT_ARTIFACTS_TOKEN }}
        run: python scripts/fetch_projects.py

      - name: Commit collected websites
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for project in blankdiss insider treage reports; do
            if [[ -d "dist/$project" ]] || git ls-files --error-unmatch "dist/$project" >/dev/null 2>&1; then
              git add -A -- "dist/$project"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Collect project websites"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            # A delayed scheduled collector must not race the 21:00 publisher/cleanup.
            if [[ "$SCHEDULED" == "true" ]]; then
              local_time="$(TZ=Europe/Stockholm date +%H%M)"
              if [[ "$local_time" < "2045" || "$local_time" > "2059" ]]; then
                echo "Utanför leveransfönstret; ingen sen schemalagd push." >&2
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
